<!doctype html><html lang="ko"><meta charset="utf-8"><title>전투 동작 검토 · 실제 캐릭터 리그</title><style>body{margin:0;background:#18202b;color:white;font:16px sans-serif}header{position:fixed;top:0;left:0;right:0;padding:12px;background:#18202bee;z-index:2}label{margin-right:16px}canvas{display:block}#status{font-size:13px}</style><header><b>실제 리그 · 전투 자세 검토</b> <label>동작 <select id="attack"><option value="jab">Lead Jab · 왼손 잽</option><option value="cross">Punching · 우클릭 펀칭</option><option value="hook">Boxing Hook · 왼손 훅</option><option value="special">G 오른손 강타</option><option value="hitHead">가벼운 머리 피격</option><option value="hitBody">몸통 피격</option><option value="hitHeavy">강한 머리 피격</option></select></label><label>이동 <select id="speed"><option value="0">정지</option><option value="4.4">달리기</option><option value="6.5">질주</option></select></label><label>시점 <select id="view"><option value="front">앞 대각선</option><option value="side">측면</option><option value="back">등 뒤</option></select></label><label>진행 <input id="phase" type="range" min="0" max="1" step=".01" value=".58"></label><button id="play">반복 재생</button><div id="status">로딩 중</div></header><script type="module">
import * as T from 'three';import {Character} from '/src/Character.js';import {ATTACKS} from '/src/Combat.js';import {boneId} from '/src/MotionRetarget.js';import {groundSoleNormal} from '/src/CharacterPose.js';
const scene=new T.Scene();scene.background=new T.Color('#abb5be');const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,100);scene.add(camera,new T.HemisphereLight(0xffffff,0x555566,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,6,5);scene.add(light);const ground=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:0x89928f}));ground.rotation.x=-Math.PI/2;scene.add(ground,new T.GridHelper(20,40));
let ready=false,playing=false,clock=new T.Clock(),elapsed=0,lastKey='';const c=new Character(scene,()=>{},()=>{ready=true;c.groundProbe=()=>0;c.group.position.y=.1;c.combatStance=true;});
const el=id=>document.getElementById(id);el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'일시정지':'반복 재생';};
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(!ready)return;const key=el('attack').value,speed=+el('speed').value,view=el('view').value,duration=ATTACKS[key]?.duration || c.actions[key].getClip().duration;if(playing)el('phase').value=((+el('phase').value+dt/duration)%1).toFixed(3);const phase=+el('phase').value;
if(lastKey!==key){c.stopAnimation();lastKey=key;}
c.combatAction={id:1,key,time:phase*duration,duration};c.combatStance=true;elapsed+=dt;
c.update(dt,speed?'RUNNING':'IDLE',new T.Vector3(0,0,speed));
{camera.position.set(...({front:[2.8,2.1,3.4],side:[4,1.6,0],back:[0,2,-4.3]}[view]));camera.lookAt(0,1,0);}
const feet=['left','right'].map(side=>{const foot=Object.values(c.bones).find(b=>boneId(b.name)===side+'foot');const tilt=groundSoleNormal(c,side,foot.getWorldQuaternion(new T.Quaternion())).angleTo(new T.Vector3(0,1,0))*180/Math.PI;return `${side} ${foot.getWorldPosition(new T.Vector3()).y.toFixed(2)}m / ${tilt.toFixed(1)}°`;}).join(' · ');
el('status').textContent=`${key} · ${Math.round(phase*100)}% · ${speed}m/s · ${c.activeAction?.getClip().name} · ${c.actions[key].getClip().userData.choreography || c.actions[key].getClip().userData.source} · ${feet}`;
renderer.render(scene,camera);}
frame();
</script></html>
