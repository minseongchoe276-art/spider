<!doctype html><html lang="ko"><meta charset="utf-8"><title>BMW 탑승·운전 검증</title><style>body{margin:0;background:#162030;color:white;font:13px system-ui}header{position:fixed;top:0;left:0;right:0;padding:12px;background:#101925ef;z-index:30}button{margin:3px;padding:10px;color:white;background:#24364a;border:1px solid #93a4b5;border-radius:4px}output{display:block;white-space:pre-wrap}#vehicle-ui{position:fixed;bottom:20px;right:20px;padding:12px;background:#101925ee;z-index:40}#vehicle-ui[hidden]{display:none}#vehicle-ui span{display:block}</style><header><b>BMW 330i · 실제 캐릭터 탑승 검증</b><button id="approach">운전석 옆으로 이동</button><button id="inside">운전 자세 확인</button><button id="follow">주행 시점</button><button id="drive">전진 3초</button><button id="reverse">후진 2초</button><button id="brake">정지</button><output id="status">캐릭터 준비 중…</output></header><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {Character} from '/src/Character.js';import {VehicleSystem} from '/src/VehicleSystem.js';import {ThirdPersonCamera} from '/src/Camera.js';
const scene=new T.Scene();scene.background=new T.Color('#a3bbc9');scene.add(new T.HemisphereLight(0xffffff,0x394755,2.7));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(8,12,-4);scene.add(sun);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,250);camera.position.set(11,6,-13);camera.lookAt(0,1,5);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,5);orbit.update();const cameraRig=new ThirdPersonCamera(camera,renderer.domElement);
const ground=new T.Mesh(new T.PlaneGeometry(180,180),new T.MeshStandardMaterial({color:0x747d82,roughness:.95}));ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new T.GridHelper(180,60,0x53626d,0x626e76);grid.position.y=.008;scene.add(grid);const wall=new T.Mesh(new T.BoxGeometry(18,4,1),new T.MeshStandardMaterial({color:0x526578}));wall.position.set(0,2,35);scene.add(wall);const ray=new T.Raycaster(),city={isStreamed:false,raycast(origin,direction,distance){scene.updateMatrixWorld(true);ray.set(origin,direction);ray.far=distance;const h=ray.intersectObjects([ground,wall],false)[0];return h?{point:h.point,distance:h.distance,normal:h.face.normal.clone().transformDirection(h.object.matrixWorld),building:h.object===wall}:null;}};
const character=new Character(scene,()=>{},()=>{}),physics={position:new T.Vector3(0,.1,0),renderPosition:new T.Vector3(0,.1,0),previousFixedPosition:new T.Vector3(0,.1,0),velocity:new T.Vector3(),state:'IDLE',facingAngle:0,clearPendingInput(){},clearWebAnchor(){character.updateWeb?.(false,null);}};character.group.position.copy(physics.position);let notice='',inspect=false,following=false,autoUntil=0,autoReverse=false,elapsed=0;const vehicle=new VehicleSystem({scene,city,physics,character,cameraRig,onNotice:s=>notice=s});
const held=new Set();addEventListener('keydown',e=>{if(['KeyW','KeyS','KeyA','KeyD','Space','KeyB'].includes(e.code)){e.preventDefault();if(e.code==='KeyB'&&!e.repeat)vehicle.interact();held.add(e.code);}});addEventListener('keyup',e=>held.delete(e.code));addEventListener('blur',()=>held.clear());
document.getElementById('approach').onclick=()=>{if(!vehicle.asset||vehicle.driving)return;const p=vehicle.doorPoint();physics.position.copy(p);physics.renderPosition.copy(p);physics.previousFixedPosition.copy(p);character.group.position.copy(p);};document.getElementById('inside').onclick=()=>{if(!vehicle.asset)return;inspect=true;following=false;const target=vehicle.asset.visual.localToWorld(new T.Vector3(.35,.95,.1));orbit.target.copy(target);camera.position.copy(vehicle.asset.frame.localToWorld(new T.Vector3(3.7,1.8,2)));orbit.update();};document.getElementById('follow').onclick=()=>{inspect=false;following=true;cameraRig.placeBehind(physics.position,physics.facingAngle,.23);};document.getElementById('drive').onclick=()=>{autoUntil=elapsed+3;autoReverse=false;inspect=false;following=true;};document.getElementById('reverse').onclick=()=>{autoUntil=elapsed+2;autoReverse=true;inspect=false;following=true;};document.getElementById('brake').onclick=()=>{autoUntil=0;if(vehicle.controller){vehicle.controller.speed=0;vehicle.controller.velocity.set(0,0,0);}};
let previous=performance.now();renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-previous)/1000);previous=now;elapsed+=dt;const automated=elapsed<autoUntil;vehicle.update(dt,{forward:held.has('KeyW')||(automated&&!autoReverse),backward:held.has('KeyS')||(automated&&autoReverse),left:held.has('KeyA'),right:held.has('KeyD'),jump:held.has('Space')},character.isLoaded);if(!vehicle.driving&&character.isLoaded){character.group.position.copy(physics.position);character.update(dt,'IDLE',new T.Vector3());}if(following&&vehicle.asset)cameraRig.update(dt,vehicle.cameraTarget,physics.velocity,false,[wall],city.raycast.bind(city),physics.facingAngle,{forward:true});else orbit.update();if(inspect&&vehicle.asset)vehicle.asset.door.rotation.y=-.95;renderer.render(scene,camera);document.getElementById('status').textContent=`${vehicle.state} · 캐릭터 ${character.isLoaded?'준비':'로딩'} · ${Math.round(Math.abs(vehicle.controller?.speed||0)*3.6)} km/h · ${notice}\n위치 ${vehicle.controller?.position.toArray().map(n=>n.toFixed(2)).join(', ')||'-'} · 바퀴 ${vehicle.asset?.wheels.length||0} · draw ${renderer.info.render.calls} · ${renderer.info.render.triangles} triangles`;});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
