<!doctype html><html lang="ko"><meta charset="utf-8"><title>홍콩 시민 · 모션과 성능 검증</title><style>body{margin:0;background:#111823;color:#e9eef7;font:13px system-ui}header{position:fixed;top:0;left:0;right:0;padding:12px;background:#111823ed;z-index:3}button,a{margin:3px;padding:7px;font:inherit}a{color:#b6ceff}output{display:block;white-space:pre-wrap;font:12px monospace;margin-top:8px}canvas{display:block}select{padding:6px}</style><header><b>주변 시민 10명 · 실제 모델 / 충돌 / 반응</b> <button id="street">가까운 거리로 이동</button><button id="overview">시민 모두 보기</button><select id="variant"><option value="all">모든 시민</option><option value="remy">Remy</option><option value="megan">Megan</option><option value="louise">Louise</option></select><button id="hit">가까운 시민 공격</button><button id="uppercut">어퍼컷</button><button id="alarm">착지 소리에 놀람</button><button id="move">다른 구역으로 이동</button><button id="pause">일시정지</button><button id="benchmark">성능 측정</button><a href="?hongKong=1">실제 홍콩</a><a href="?">검증 바닥</a><output id="status">모델 로딩 중</output><output id="bench"></output></header><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {AmbientCitizens} from '/src/AmbientCitizens.js';import {loadCitizenAssets} from '/src/CitizenActor.js';import {CombatSystem} from '/src/Combat.js';import {City} from '/src/City.js';
const hk=new URLSearchParams(location.search).has('hongKong'),scene=new T.Scene();scene.background=new T.Color('#acbec6');scene.add(new T.HemisphereLight(0xffffff,0x606d80,2.6));const sun=new T.DirectionalLight(0xffffff,2.8);sun.position.set(5,9,3);scene.add(sun);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);camera.position.set(0,7,-12);camera.lookAt(0,2,15);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,15);controls.update();const player={position:new T.Vector3(0,2.01,0),velocity:new T.Vector3(),state:'IDLE',facingAngle:0};let city;
if(hk){const {UrbanGroundCity}=await import('/src/UrbanGroundCity.js');camera.position.set(0,100,-100);controls.target.set(0,20,0);controls.update();city=new UrbanGroundCity(scene,camera,renderer,()=>{});player.position.y=18;city.playerPosition.copy(player.position);}else{
 const colliders=[{minX:-13,maxX:13,minY:2,maxY:8,minZ:8,maxZ:10},{minX:17,maxX:20,minY:2,maxY:12,minZ:-20,maxZ:8}],meshes=[];const floor=new T.Mesh(new T.PlaneGeometry(600,600),new T.MeshStandardMaterial({color:'#858d88'}));floor.rotation.x=-Math.PI/2;floor.position.y=2;scene.add(floor);meshes.push(floor);for(const box of colliders){const m=new T.Mesh(new T.BoxGeometry(box.maxX-box.minX,box.maxY-box.minY,box.maxZ-box.minZ),new T.MeshStandardMaterial({color:'#637080'}));m.position.set((box.maxX+box.minX)/2,(box.maxY+box.minY)/2,(box.maxZ+box.minZ)/2);scene.add(m);meshes.push(m);}const ray=new T.Raycaster();city={colliders,raycast(origin,direction,distance){ray.set(origin,direction);ray.far=distance;const h=ray.intersectObjects(meshes,false)[0];return h?{point:h.point,distance:h.distance,normal:h.face.normal.clone().transformDirection(h.object.matrixWorld)}:null;},update(){scene.updateMatrixWorld(true);}};}
player.city=city;const status=document.getElementById('status'),assets=await loadCitizenAssets(),manager=new AmbientCitizens({scene,city,player,camera,assets}),hero={combatStance:true},combat=new CombatSystem(scene,player,hero,{getTargets:()=>manager.targets});combat.mode='combat';let paused=false,started=performance.now(),samples=[],last=performance.now(),benchmark=null,benchFrames=[];
document.getElementById('street').onclick=()=>{for(let i=0;i<80;i++){const p=player.position.clone();p.x+=Math.sin(i*2.399963)*(i*.8);p.z+=Math.cos(i*2.399963)*(i*.8);const h=manager.floor(p,true);if(h==null)continue;p.y=h+.01;if(manager.ray(p.clone().add(new T.Vector3(0,.2,0)),new T.Vector3(0,1,0),30))continue;player.position.copy(p);if(hk)city.playerPosition.copy(p);controls.target.copy(p).add(new T.Vector3(0,1.4,7));camera.position.copy(p).add(new T.Vector3(0,2,-5));controls.update();break;}};
function nearest(){return manager.targets.filter(n=>document.getElementById('variant').value==='all'||n.actor.variant===document.getElementById('variant').value).slice().sort((a,b)=>a.position.distanceTo(player.position)-b.position.distanceTo(player.position))[0];}
function attack(key){const n=nearest();if(!n)return;const offset=new T.Vector3(Math.sin(n.yaw),0,Math.cos(n.yaw)).multiplyScalar(1);player.position.copy(n.position).add(offset);player.facingAngle=Math.atan2(n.position.x-player.position.x,n.position.z-player.position.z);const a={key,hits:new Set()};combat.strike(a,{damage:key==='special'?48:12,reach:1.9});controls.target.copy(n.position).add(new T.Vector3(0,1,0));camera.position.copy(n.position).add(new T.Vector3(3,2.3,4));controls.update();}
document.getElementById('hit').onclick=()=>attack('cross');document.getElementById('uppercut').onclick=()=>attack('special');document.getElementById('alarm').onclick=()=>manager.alarm(nearest()?.position||player.position,18);document.getElementById('overview').onclick=()=>{const list=manager.targets;if(!list.length)return;const center=list.reduce((v,n)=>v.add(n.position),new T.Vector3()).divideScalar(list.length);controls.target.copy(center);camera.position.copy(center).add(new T.Vector3(0,50,-75));controls.update();};document.getElementById('move').onclick=()=>{player.position.x+=200;controls.target.copy(player.position);camera.position.copy(player.position).add(new T.Vector3(0,8,-14));controls.update();if(hk)city.playerPosition.copy(player.position);};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'계속':'일시정지';};document.getElementById('benchmark').onclick=()=>{benchmark='baseline';benchFrames=[];document.getElementById('bench').textContent='기준 렌더 측정 중…';};
const output={};renderer.setAnimationLoop(()=>{const now=performance.now(),raw=(now-last)/1000,dt=Math.min(raw,.05);last=now;city.update((now-started)/1000);if(benchmark==='baseline'){for(const n of manager.targets)n.mesh.visible=false;}else{for(const n of manager.targets)n.mesh.visible=true;manager.update(dt,!paused);}renderer.render(scene,camera);if(benchmark){benchFrames.push({frameMs:raw*1000,cpu:benchmark==='baseline'?0:manager.metrics.lastMs,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles});if(benchFrames.length>=150){const valid=benchFrames.slice(30),ms=valid.map(v=>v.frameMs).sort((a,b)=>a-b),cpu=valid.map(v=>v.cpu).sort((a,b)=>a-b);output[benchmark]={frames:valid.length,p50Ms:ms[Math.floor(ms.length*.5)],p95Ms:ms[Math.floor(ms.length*.95)],cpuP95:cpu[Math.floor(cpu.length*.95)],calls:valid.at(-1).calls,triangles:valid.at(-1).triangles};benchFrames=[];if(benchmark==='baseline'){benchmark='citizens';document.getElementById('bench').textContent='시민 10명 렌더 측정 중…';}else{benchmark=null;document.getElementById('bench').textContent=JSON.stringify({environment:hk?'Hong Kong streamed tiles':'fixture',activeCitizens:manager.metrics.active,...output},null,2);}}}status.textContent=`${hk?'실제 홍콩':'충돌 검증 바닥'} · 활성 ${manager.metrics.active}/10${hk?' · 지형 '+city.buildingMeshes.length+' meshes / ready '+city.isReady+' · player Y '+player.position.y.toFixed(1)+' · roots '+city.loadedRoots+' · queues '+city.tilesets.map(t=>t.stats.downloading+'/'+t.stats.parsing).join(' | ')+(city.lastError?' · '+city.lastError.message:''):''} · 모델 ${assets.map(a=>a.id).join(' / ')}\n${manager.targets.map(n=>`${n.actor.variant}:${n.state}`).join(' · ')}\nAI ${manager.metrics.lastMs.toFixed(2)}ms · 이번 프레임 ray ${manager.metrics.raycasts} · pool ${manager.metrics.pool} · 생성 ${manager.metrics.spawned} · 재사용 ${manager.metrics.recycled} · draw ${renderer.info.render.calls} · triangles ${renderer.info.render.triangles}`;});window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
