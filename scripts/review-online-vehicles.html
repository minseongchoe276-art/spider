<!doctype html><html lang="ko"><meta charset="utf-8"><title>온라인 차량 · 두 클라이언트 검증</title><style>body{margin:0;background:#172435;color:white;font:13px system-ui}header{position:fixed;top:0;left:0;right:0;padding:12px;background:#101925ef;z-index:40}button{padding:9px;margin:3px;background:#263e54;color:white;border:1px solid #a1b3c4;border-radius:5px}output{display:block;white-space:pre-wrap}#vehicle-ui{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:35;padding:10px;background:#101925ed;display:flex;gap:8px;align-items:center}#vehicle-ui[hidden]{display:none}select{padding:10px;background:#233a4d;color:white}</style><header><b>온라인 차량 · 실제 WebSocket / 실제 두 캐릭터</b><button id="approach">내 운전석으로 이동</button><button id="drive">2초 전진</button><button id="brake">정지</button><button id="all">두 차량 보기</button><button id="other">상대 운전석 확인</button><output id="status">준비 중…</output></header><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {Character} from '/src/Character.js';import {City} from '/src/City.js';import {VehicleSystem} from '/src/VehicleSystem.js';import {RemoteMotion,capturePose,sanitizePose} from '/src/RemoteMotion.js';
const query=new URLSearchParams(location.search),isHost=!query.has('code'),scene=new T.Scene();scene.background=new T.Color('#a6c6d6');scene.add(new T.HemisphereLight(0xffffff,0x556578,2.8));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(12,20,4);scene.add(sun);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,400);camera.position.set(13,12,-12);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(3,.8,9);orbit.update();const city=new City(scene),character=new Character(scene,()=>{},()=>{}),physics={position:new T.Vector3(isHost?0:8,.1,0),renderPosition:new T.Vector3(),previousFixedPosition:new T.Vector3(),velocity:new T.Vector3(),state:'IDLE',facingAngle:0,clearPendingInput(){},clearWebAnchor(){character.updateWeb?.(false,null);}};let room=null,id=null,code='',notice='',lastSend=0,elapsed=0,autoUntil=0,started=false;const players=new Map(),avatars=new Map(),vehicle=new VehicleSystem({scene,city,physics,character,allowed:()=>room?.phase==='playing',getOtherVehicles:()=>[...players.values()].filter(p=>p.id!==id).map(p=>p.vehicle).filter(Boolean),onNotice:s=>notice=s});if(!isHost)vehicle.selectVehicle('corvette');
const ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`),send=data=>ws.readyState===1&&ws.send(JSON.stringify(data));ws.onopen=()=>send(isHost?{type:'create',mode:'free',city:'procedural',capacity:2,playerName:'BMW 운전자'}:{type:'join',code:query.get('code'),city:'procedural',playerName:'Corvette 관찰자'});ws.onmessage=({data})=>{const m=JSON.parse(data);if(m.type==='joined'){id=m.id;code=m.code;send({type:'ready',ready:true});}if(m.type==='room'){room=m.room;code=room.code;const ids=new Set();for(const p of m.players){ids.add(p.id);players.set(p.id,{...players.get(p.id),...p});}for(const key of players.keys())if(!ids.has(key)){players.delete(key);avatars.get(key)?.dispose();avatars.delete(key);}if(isHost&&!started&&room.phase==='waiting'&&m.players.length===2&&m.players.every(p=>p.ready)){started=true;send({type:'start'});}}if(m.type==='move'){const p=players.get(m.id)||{id:m.id,team:'free'};Object.assign(p,m,{pose:sanitizePose(m.pose),vehicle:m.vehicle||p.vehicle,seen:true});players.set(p.id,p);}if(m.type==='correction'){notice='서버 위치 보정';if(!vehicle.applyCorrection(m)){physics.position.set(m.x,m.y,m.z);physics.renderPosition.copy(physics.position);}}if(m.type==='error')notice=m.message;};
document.getElementById('approach').onclick=()=>{if(!vehicle.asset||vehicle.driving)return;physics.position.copy(vehicle.doorPoint());physics.renderPosition.copy(physics.position);character.group.position.copy(physics.position);};document.getElementById('drive').onclick=()=>autoUntil=elapsed+2;document.getElementById('brake').onclick=()=>{autoUntil=0;if(vehicle.controller){vehicle.controller.speed=0;vehicle.controller.velocity.set(0,0,0);}};document.getElementById('all').onclick=()=>{orbit.target.set(4,.8,11);camera.position.set(15,13,-10);orbit.update();};document.getElementById('other').onclick=()=>{const other=[...avatars.values()].find(a=>a.vehicle.asset);if(!other)return;const a=other.vehicle.asset;orbit.target.copy(a.visual.localToWorld(new T.Vector3(.4,.85,0)));camera.position.copy(a.frame.localToWorld(new T.Vector3(3.4,1.55,1.4)));orbit.update();};
let previous=performance.now();renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-previous)/1000);previous=now;elapsed+=dt;const active=character.isLoaded&&room?.phase==='playing';vehicle.update(dt,{forward:elapsed<autoUntil},active);if(!vehicle.driving&&character.isLoaded){vehicle.resolvePedestrian();character.group.position.copy(physics.position);character.update(dt,'IDLE',new T.Vector3());}if(active&&now-lastSend>100){send({type:'move',x:physics.position.x,y:physics.position.y,z:physics.position.z,facing:physics.facingAngle,pose:capturePose(physics,character)});lastSend=now;}if(character.isLoaded)for(const p of players.values()){if(p.id===id||!p.seen)continue;let a=avatars.get(p.id);if(!a){a=new RemoteMotion(scene,character,p,city);avatars.set(p.id,a);}a.receive(p,p.pose,now);p.pose=null;a.update(dt,now);}orbit.update();renderer.render(scene,camera);document.getElementById('status').textContent=`방 ${code||'-'} · ${isHost?'호스트':'참가자'} · ${room?.phase||'연결 중'} · 캐릭터 ${character.isLoaded?'준비':'로딩'} · 내 ${vehicle.selected} ${vehicle.state}\n${[...avatars.entries()].map(([id,a])=>`상대 ${id}: ${a.vehicle.snapshot?.model||'-'} ${a.vehicle.snapshot?.phase||'-'} · 차량 ${!!a.vehicle.asset} · 좌석 자세 ${!!a.vehicle.driver}`).join('\n')}\n${notice}`;});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});addEventListener('pagehide',()=>{send({type:'leave'});ws.close();});
</script></html>
