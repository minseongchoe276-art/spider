<!doctype html><html lang="ko"><meta charset="utf-8"><title>G 돌진 어퍼컷 · 타격과 피격 검증</title><style>body{margin:0;background:#111522;color:#fff;font:14px system-ui}header{position:fixed;top:0;left:0;right:0;background:#111522ed;padding:14px;z-index:2}button,select{font:inherit;margin:0 10px 0 4px;padding:6px}#status{margin-top:8px;font-size:12px}canvas{display:block}</style><header><b>G 돌진 어퍼컷</b> <button id="fire">G · 다시 재생</button><button id="contact">접촉 순간</button><label>상황<select id="case"><option value="hit">명중</option><option value="miss">빗나감</option><option value="wall">벽 앞</option></select></label><label>속도<select id="rate"><option value="0">일시정지</option><option value="1" selected>실제 속도</option><option value=".25">느리게</option></select></label><label><input type="checkbox" id="reduced">동작 효과 줄이기</label><label><input type="checkbox" id="loop" checked>반복</label><div id="status">캐릭터 로딩 중</div></header><script type="module">
import * as T from 'three';import {Character} from '/src/Character.js';import {CombatSystem} from '/src/Combat.js';import {SwingPhysics} from '/src/SwingPhysics.js';import {City} from '/src/City.js';import {VFXManager} from '/src/VFX.js';
const scene=new T.Scene();scene.background=new T.Color('#aeb9c1');scene.add(new T.HemisphereLight(0xffffff,0x5f6b80,2.4));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,6,2);scene.add(light);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);camera.position.set(6,3.2,5);camera.lookAt(0,1,1.7);camera.userData.movementYaw=0;scene.add(camera);const ground=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#86938f'}));ground.rotation.x=-Math.PI/2;scene.add(ground,new T.GridHelper(30,30));
const $=id=>document.getElementById(id);let ready=0,physics,combat,enemy,elapsed=0,reaction=0,effects=0;const actor=new Character(scene,()=>{},loaded),victim=new Character(scene,()=>{},loaded),vfx=new VFXManager(scene);const wall=new T.Mesh(new T.BoxGeometry(4,3,.2),new T.MeshStandardMaterial({color:'#59677a',transparent:true,opacity:.7}));wall.position.set(0,1.5,1.6);scene.add(wall);const city={colliders:[],buildingMeshes:[],raycast:City.prototype.raycast,checkCollision:City.prototype.checkCollision};
function loaded(){if(++ready<2)return;actor.groundProbe=victim.groundProbe=()=>0;physics=new SwingPhysics(scene,city,actor,new Proxy({},{get:()=>()=>{}}));combat=new CombatSystem(scene,physics,actor,{vfx});combat.toggle();reset();}
function reset(){if(ready<2)return;combat.cancel();combat.stamina=100;combat.specialCooldown=0;physics.position.set(0,.1,0);physics.previousFixedPosition.copy(physics.position);physics.renderPosition.copy(physics.position);physics.velocity.set(0,0,0);physics.state='IDLE';physics.facingAngle=0;actor.group.position.copy(physics.position);victim.group.position.set($('case').value==='miss'?3:0,.1,3.25);victim.targetFacingAngle=victim.visualYaw=Math.PI;victim.combatStance=true;victim.combatAction=null;enemy={position:victim.group.position,mesh:victim.group,health:100,stagger:0,flash:0};combat.enemies=[enemy];wall.visible=$('case').value==='wall';city.colliders=wall.visible?[{minX:-2,maxX:2,minY:0,maxY:3,minZ:1.5,maxZ:1.7}]:[];elapsed=0;reaction=0;effects=0;combat.special(camera);}
$('fire').onclick=reset;$('case').onchange=reset;window.addEventListener('keydown',e=>{if(e.code==='KeyG'&&!e.repeat){e.preventDefault();reset();}});function simulate(dt){if(ready===2){elapsed+=dt;vfx.reducedMotion=$('reduced').checked;combat.before(dt,camera,{});physics.update(dt,{},camera);combat.after(dt);if(enemy.health<100 && !reaction){reaction=elapsed;effects++;victim.combatAction={id:1,key:'hitUppercut',time:0,duration:.95};}if(victim.combatAction){victim.combatAction.time+=dt;if(victim.combatAction.time>victim.combatAction.duration)victim.combatAction=null;}victim.update(dt,'IDLE',new T.Vector3());vfx.update(dt);$('status').textContent=`${combat.action?.key==='special'?'돌진 / 올려치기':'회복'} · ${elapsed.toFixed(2)}초 · 돌진 ${physics.position.z.toFixed(2)}m · 상대 HP ${enemy.health} · 피격 ${victim.combatAction?.key||'대기'} · 명중 효과 ${effects}회 · 쿨타임 ${combat.specialCooldown.toFixed(1)}초`;if($('loop').checked && elapsed>2.8)reset();}}
$('contact').onclick=()=>{reset();for(let i=0;i<60;i++)simulate(1/120);$('rate').value='0';};const clock=new T.Clock();renderer.setAnimationLoop(()=>{simulate(Math.min(clock.getDelta(),.04)*Number($('rate').value));renderer.render(scene,camera);});window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
